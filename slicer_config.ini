# PrusaSlicer Configuration Profile for Prusa i3 MK3S+ / MK4 (PLA 0.20mm)
# Optimized for Headless CLI Execution & Debian apt compatibility

# Print Settings
layer_height = 0.2
first_layer_height = 0.2
perimeters = 3
top_solid_layers = 4
bottom_solid_layers = 4
fill_density = 20%
fill_pattern = grid
skirts = 1
skirt_distance = 3
skirt_height = 1
brim_width = 0
support_material = 0
infill_speed = 60
perimeter_speed = 45
external_perimeter_speed = 35
travel_speed = 120
first_layer_speed = 20

# Filament Settings (Generic PLA)
filament_colour = #FF8000
filament_type = PLA
filament_diameter = 1.75
temperature = 215
first_layer_temperature = 215
bed_temperature = 60
first_layer_bed_temperature = 60
fan_below_layer_time = 100
cooling = 1
min_fan_speed = 100
max_fan_speed = 100

# Printer Settings
printer_model = MK3S
nozzle_diameter = 0.4
bed_shape = 0x0,250x0,250x210,0x210
max_print_height = 210
gcode_flavor = reprap
extruder_offset = 0x0
retract_length = 0.8
retract_speed = 35
retract_lift = 0.4

# Start & End G-code
start_gcode = M862.3 P "[printer_model]" ; printer model check\nM862.1 P[nozzle_diameter] ; nozzle diameter check\nM104 S[first_layer_temperature] ; set extruder temp\nM140 S[first_layer_bed_temperature] ; set bed temp\nM190 S[first_layer_bed_temperature] ; wait for bed temp\nM109 S[first_layer_temperature] ; wait for extruder temp\nG28 W ; home all without mesh bed level\nG80 ; mesh bed leveling\nG1 Y-3.0 F1000.0 ; go outside print area\nG92 E0.0\nG1 X60.0 E9.0 F1000.0 ; intro line\nG1 X100.0 E12.5 F1000.0 ; intro line\nG92 E0.0
end_gcode = G4 ; wait\nM104 S0 ; turn off temperature\nM140 S0 ; turn off heatbed\nM107 ; turn off fan\nG1 X0 Y200 F3000 ; home X axis and present print\nM84 ; disable motors
